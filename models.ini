; llama-turboq router model registry (used with --models-preset)
; Per-model spec-type is mandatory: draft-mtp aborts the server on models
; without trained MTP heads (GGML_ASSERT "MTP requires n_layer_nextn > 0").
; Requests must name a model, e.g. POST /v1/chat/completions {"model": "..."}.
;
; Section names are the model names the API exposes. They reflect the real
; models (verified against GGUF general.name):
;   Qwopus3.6-27B-v2-MTP          - production model, 15 native MTP heads
;   Qwen3.6-27B-MTP-pi-reasoning  - pi-reasoning variant, trained MTP head
;   Qwen3.6-27B-MTP               - Unsloth GGUF with the MTP head trained
;                                   in-file (general.name: "Qwen3.6-27B")
;   Qwen3.6-27B                   - stock dense base (Qwen/Qwen3.6-27B)
;   Qwen3.6-35B-A3B-UD            - 35B total / 3B active MoE
;   Ornith-1.0-35B-UD             - 35B MoE (GGUF metadata mislabeled 9B)
;   Ornith-1.0-9B                 - 9B dense agentic coding model
;   Gemma-4-12B / Gemma-4-12B-Q8  - 12B instruct, Q4_K_M / Q8_0
;
; MTP wiring:
;   qwen3.6-27b + MTP variants (Qwopus, pi-reasoning) have native MTP heads:
;     spec-type = draft-mtp
;   gemma4-12b variants use the gemma4-assistant sidecar draft model:
;     spec-type = draft-mtp + spec-draft-model = mtp-gemma-4-12b-it.gguf
;   plain models (27b base, 35b a3b moe, ornith) must NOT enable draft-mtp.

[*]
c                  = 262144
parallel           = 1
n-gpu-layers       = 99
flash-attn         = on
jinja              = true
reasoning          = on
reasoning-budget   = 8192

[Qwopus3.6-27B-v2-MTP]
model              = /home/jack/llm/models/Qwopus3.6-27B-v2-MTP-Q4_K_M.gguf
ctk                = tbq4_0
ctv                = tbq4_0
spec-type          = draft-mtp
spec-draft-n-max   = 3
load-on-startup    = true

[Qwen3.6-27B-MTP-pi-reasoning]
model              = /home/jack/llm/models/Qwen3.6-27B-MTP-pi-reasoning-Q4_K_M.gguf
ctk                = q4_0
ctv                = q4_0
spec-type          = draft-mtp
spec-draft-n-max   = 3

[Qwen3.6-27B-MTP]
model              = /home/jack/llm/models/Qwen3.6-27B-Q4_K_M.gguf
ctk                = q4_0
ctv                = q4_0
spec-type          = draft-mtp
spec-draft-n-max   = 3

[Qwen3.6-27B]
model              = /home/jack/llm/models/Qwen_Qwen3.6-27B-Q4_K_M.gguf
ctk                = q4_0
ctv                = q4_0

[Qwen3.6-35B-A3B-UD]
model              = /home/jack/llm/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
ctk                = q8_0
ctv                = q8_0
temp               = 0.85
min-p              = 0.02
presence-penalty   = 0.1
batch-size         = 4096
ubatch-size        = 1024
cache-ram          = 8192

[Ornith-1.0-35B-UD]
